<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="8" y="8" width="904" height="374" rx="14" fill="#141416" stroke="#2c2c30" stroke-width="1.5"/>

  <!-- Left Panel: Context Usage Indicator -->
  <g transform="translate(32, 26)" class="font">
    <text x="0" y="18" fill="#a1a1aa" font-size="12.5" font-weight="600">1. 上下文用量指示器（输入框旁圆环 + 分类明细弹窗）</text>

    <!-- Popover Box -->
    <rect x="0" y="34" width="380" height="246" rx="12" fill="#1f1f23" stroke="#38383f" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="16" y="60" fill="#f4f4f5" font-size="13" font-weight="600">上下文窗口</text>
    <rect x="88" y="46" width="44" height="18" rx="9" fill="#27272a"/>
    <text x="110" y="58" text-anchor="middle" fill="#d4d4d8" font-size="10.5" font-weight="500">已压缩</text>
    <text x="364" y="60" text-anchor="end" fill="#d4d4d8" font-size="12.5" font-weight="500" class="mono">68.4k / 200k (34.2%)</text>

    <!-- Multi-segment Bar -->
    <rect x="16" y="74" width="348" height="7" rx="3.5" fill="#2e2e34"/>
    <rect x="16" y="74" width="26" height="7" rx="3.5" fill="#3b82f6"/>
    <rect x="42" y="74" width="34" height="7" fill="#8b5cf6"/>
    <rect x="76" y="74" width="18" height="7" fill="#10b981"/>
    <rect x="94" y="74" width="42" height="7" fill="#f59e0b"/>

    <!-- Breakdown Rows -->
    <g font-size="12.5" fill="#e4e4e7">
      <circle cx="22" cy="105" r="4" fill="#3b82f6"/>
      <text x="34" y="109">系统提示词</text>
      <text x="364" y="109" text-anchor="end" fill="#a1a1aa" class="mono">14.8k (7.4%)</text>

      <circle cx="22" cy="133" r="4" fill="#8b5cf6"/>
      <text x="34" y="137">工具与 MCP</text>
      <text x="364" y="137" text-anchor="end" fill="#a1a1aa" class="mono">19.6k (9.8%)</text>

      <circle cx="22" cy="161" r="4" fill="#10b981"/>
      <text x="34" y="165">技能与规则</text>
      <text x="364" y="165" text-anchor="end" fill="#a1a1aa" class="mono">9.8k (4.9%)</text>

      <circle cx="22" cy="189" r="4" fill="#f59e0b"/>
      <text x="34" y="193">对话消息</text>
      <text x="364" y="193" text-anchor="end" fill="#a1a1aa" class="mono">24.2k (12.1%)</text>
    </g>

    <!-- Simulated Composer Bar Bottom -->
    <rect x="0" y="294" width="380" height="44" rx="10" fill="#1c1c20" stroke="#2e2e34" stroke-width="1"/>
    <text x="14" y="320" fill="#71717a" font-size="12.5">输入消息或 /命令…</text>
    <!-- Trigger Pill -->
    <rect x="296" y="302" width="72" height="28" rx="14" fill="#27272c"/>
    <circle cx="314" cy="316" r="6.5" fill="none" stroke="#52525b" stroke-width="2"/>
    <circle cx="314" cy="316" r="6.5" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="40.8" stroke-dashoffset="26.8" transform="rotate(-90 314 316)" stroke-linecap="round"/>
    <text x="328" y="320" fill="#e4e4e7" font-size="12" font-weight="500" class="mono">34%</text>
  </g>

  <!-- Divider -->
  <line x1="446" y1="28" x2="446" y2="362" stroke="#26262a" stroke-width="1"/>

  <!-- Right Panel: Token Usage & Cost Estimation -->
  <g transform="translate(474, 26)" class="font">
    <text x="0" y="18" fill="#a1a1aa" font-size="12.5" font-weight="600">2. 单轮回复用量 ($) 与公开价格表费用估算</text>

    <!-- Cost Popover Box -->
    <rect x="0" y="34" width="414" height="304" rx="12" fill="#1f1f23" stroke="#38383f" stroke-width="1" filter="url(#cardShadow)"/>
    <text x="16" y="60" fill="#f4f4f5" font-size="13.5" font-weight="600">本轮用量与估算费用</text>
    <text x="398" y="60" text-anchor="end" fill="#10b981" font-size="13.5" font-weight="600" class="mono">$0.0184</text>

    <line x1="16" y1="74" x2="398" y2="74" stroke="#2e2e34" stroke-width="1"/>

    <!-- Main Model Section -->
    <text x="16" y="96" fill="#e4e4e7" font-size="12.5" font-weight="600">主对话 · Claude Sonnet 5.5 (High)</text>
    <text x="398" y="96" text-anchor="end" fill="#d4d4d8" font-size="12.5" font-weight="500" class="mono">$0.0162</text>

    <g font-size="12" fill="#a1a1aa">
      <text x="16" y="120">未命中缓存输入</text>
      <text x="260" y="120" text-anchor="end" class="mono">2,140 tokens</text>
      <text x="398" y="120" text-anchor="end" class="mono">$0.0064</text>

      <text x="16" y="142">缓存读取 (Cache read)</text>
      <text x="260" y="142" text-anchor="end" class="mono">18,400 tokens</text>
      <text x="398" y="142" text-anchor="end" class="mono">$0.0055</text>

      <text x="16" y="164">思考与回复输出</text>
      <text x="260" y="164" text-anchor="end" class="mono">286 tokens</text>
      <text x="398" y="164" text-anchor="end" class="mono">$0.0043</text>
    </g>

    <line x1="16" y1="182" x2="398" y2="182" stroke="#2e2e34" stroke-width="1"/>

    <!-- Subagent Section -->
    <text x="16" y="204" fill="#e4e4e7" font-size="12.5" font-weight="600">子代理 (research) · Gemini 3.8 Flash</text>
    <text x="398" y="204" text-anchor="end" fill="#d4d4d8" font-size="12.5" font-weight="500" class="mono">$0.0022</text>

    <g font-size="12" fill="#a1a1aa">
      <text x="16" y="228">输入 + 缓存读取</text>
      <text x="260" y="228" text-anchor="end" class="mono">12,500 tokens</text>
      <text x="398" y="228" text-anchor="end" class="mono">$0.0014</text>

      <text x="16" y="250">输出</text>
      <text x="260" y="250" text-anchor="end" class="mono">640 tokens</text>
      <text x="398" y="250" text-anchor="end" class="mono">$0.0008</text>
    </g>

    <!-- Bottom Note -->
    <rect x="16" y="272" width="382" height="50" rx="8" fill="#18181b"/>
    <text x="28" y="293" fill="#a1a1aa" font-size="11.5">原版客户端因缺少价格表恒显示 $0.0000。</text>
    <text x="28" y="311" fill="#a1a1aa" font-size="11.5">开启「估算费用」后按 models.dev 公开列表价自动重算。</text>
  </g>
</svg>
