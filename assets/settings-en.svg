<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="16" y="16" width="888" height="608" rx="14" fill="#141416" stroke="#2c2c30" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- macOS Traffic Lights & Titlebar -->
  <circle cx="42" cy="40" r="6" fill="#ff5f57"/>
  <circle cx="62" cy="40" r="6" fill="#febc2e"/>
  <circle cx="82" cy="40" r="6" fill="#28c840"/>
  <text x="460" y="45" text-anchor="middle" fill="#8e8e93" font-size="12.5" font-weight="500" class="font">Antigravity — Settings</text>
  <line x1="16" y1="62" x2="904" y2="62" stroke="#26262a" stroke-width="1"/>

  <!-- Left Navigation Sidebar -->
  <rect x="17" y="63" width="198" height="560" fill="#18181b" rx="0"/>
  <line x1="215" y1="62" x2="215" y2="623" stroke="#26262a" stroke-width="1"/>

  <g class="font" font-size="13" fill="#a1a1aa">
    <text x="42" y="102">Account</text>
    <text x="42" y="136">General</text>
    <text x="42" y="170">Appearance</text>
    <text x="42" y="204">Shortcuts</text>
    <text x="42" y="238">Notifications</text>
    <text x="42" y="272">Advanced</text>
    <text x="42" y="306">Running</text>
    <text x="42" y="340">Developer</text>
  </g>

  <!-- Active Sidebar Item: AGY-flags -->
  <rect x="28" y="356" width="174" height="32" rx="7" fill="#27272a"/>
  <circle cx="42" cy="372" r="3.5" fill="#3b82f6"/>
  <text x="54" y="377" fill="#f4f4f5" font-size="13" font-weight="600" class="font">AGY-flags</text>

  <!-- Main Content Area -->
  <g class="font" transform="translate(252, 86)">
    <!-- Page Title & Tagline -->
    <text x="0" y="22" fill="#f4f4f5" font-size="22" font-weight="600">AGY-flags</text>
    <text x="0" y="44" fill="#a1a1aa" font-size="13">Choose which experimental features of Antigravity are on. Most changes need a restart.</text>

    <!-- Restart Notice Banner -->
    <rect x="0" y="60" width="608" height="40" rx="8" fill="#422006" fill-opacity="0.45" stroke="#d97706" stroke-opacity="0.45" stroke-width="1"/>
    <text x="14" y="85" fill="#fde68a" font-size="13">You changed flags. Restart Antigravity to apply them.</text>
    <rect x="468" y="67" width="128" height="26" rx="6" fill="#3b82f6"/>
    <text x="532" y="84" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="500">Restart Antigravity</text>

    <!-- Master Switch Card -->
    <rect x="0" y="114" width="608" height="58" rx="11" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1"/>
    <text x="14" y="138" fill="#f4f4f5" font-size="13.5" font-weight="500">Enable agy-flags</text>
    <text x="14" y="157" fill="#a1a1aa" font-size="12">Rewriting the flag configuration that Google sends to Antigravity.</text>
    <!-- Switch ON -->
    <rect x="550" y="131" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="143" r="8" fill="#ffffff"/>

    <!-- Section: Usage and costs -->
    <text x="2" y="196" fill="#e4e4e7" font-size="13.5" font-weight="600">Usage and costs</text>
    <rect x="0" y="206" width="608" height="174" rx="11" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1"/>
    <line x1="0" y1="264" x2="608" y2="264" stroke="#2e2e33" stroke-width="1"/>
    <line x1="0" y1="322" x2="608" y2="322" stroke="#2e2e33" stroke-width="1"/>

    <!-- Row 1: Context usage indicator -->
    <text x="14" y="229" fill="#f4f4f5" font-size="13.5" font-weight="500">Context usage indicator</text>
    <text x="14" y="249" fill="#a1a1aa" font-size="12">Shows how full the context window is next to the input box.</text>
    <rect x="550" y="223" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="235" r="8" fill="#ffffff"/>

    <!-- Row 2: Token usage per reply -->
    <text x="14" y="287" fill="#f4f4f5" font-size="13.5" font-weight="500">Token usage per reply</text>
    <text x="14" y="307" fill="#a1a1aa" font-size="12">Adds a $ button under each reply that shows the tokens of the turn and cache hits.</text>
    <rect x="550" y="281" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="293" r="8" fill="#ffffff"/>

    <!-- Row 3: Estimated costs -->
    <text x="14" y="345" fill="#f4f4f5" font-size="13.5" font-weight="500">Estimated costs</text>
    <rect x="118" y="332" width="128" height="17" rx="8.5" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="182" y="344" text-anchor="middle" fill="#d4d4d8" font-size="10" font-weight="600">connects to models.dev</text>
    <text x="14" y="365" fill="#a1a1aa" font-size="12">Fills in the costs in the token usage from public prices on models.dev; an estimate, not a bill.</text>
    <rect x="550" y="339" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="351" r="8" fill="#ffffff"/>

    <!-- Section: Conversations -->
    <text x="2" y="404" fill="#e4e4e7" font-size="13.5" font-weight="600">Conversations</text>
    <rect x="0" y="414" width="608" height="116" rx="11" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1"/>
    <line x1="0" y1="472" x2="608" y2="472" stroke="#2e2e33" stroke-width="1"/>

    <!-- Row 1: Conversation forking -->
    <text x="14" y="437" fill="#f4f4f5" font-size="13.5" font-weight="500">Conversation forking</text>
    <text x="14" y="457" fill="#a1a1aa" font-size="12">Lets you branch a new conversation off any step of a conversation.</text>
    <rect x="550" y="431" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="443" r="8" fill="#ffffff"/>

    <!-- Row 2: Conversation groups -->
    <text x="14" y="495" fill="#f4f4f5" font-size="13.5" font-weight="500">Conversation groups</text>
    <text x="14" y="515" fill="#a1a1aa" font-size="12">Lets you put conversations into groups you create.</text>
    <rect x="550" y="489" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="501" r="8" fill="#ffffff"/>
  </g>
</svg>
