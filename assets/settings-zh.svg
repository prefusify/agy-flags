<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="16" y="16" width="888" height="608" rx="14" fill="#141416" stroke="#2c2c30" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- macOS Traffic Lights & Titlebar -->
  <circle cx="42" cy="40" r="6" fill="#ff5f57"/>
  <circle cx="62" cy="40" r="6" fill="#febc2e"/>
  <circle cx="82" cy="40" r="6" fill="#28c840"/>
  <text x="460" y="45" text-anchor="middle" fill="#8e8e93" font-size="12.5" font-weight="500" class="font">Antigravity — 设置</text>
  <line x1="16" y1="62" x2="904" y2="62" stroke="#26262a" stroke-width="1"/>

  <!-- Left Navigation Sidebar -->
  <rect x="17" y="63" width="198" height="560" fill="#18181b" rx="0"/>
  <line x1="215" y1="62" x2="215" y2="623" stroke="#26262a" stroke-width="1"/>

  <g class="font" font-size="13" fill="#a1a1aa">
    <text x="42" y="102">账户</text>
    <text x="42" y="136">通用</text>
    <text x="42" y="170">外观</text>
    <text x="42" y="204">快捷键</text>
    <text x="42" y="238">通知</text>
    <text x="42" y="272">高级</text>
    <text x="42" y="306">运行中</text>
    <text x="42" y="340">开发者</text>
  </g>

  <!-- Active Sidebar Item: AGY-flags -->
  <rect x="28" y="356" width="174" height="32" rx="7" fill="#27272a"/>
  <circle cx="42" cy="372" r="3.5" fill="#3b82f6"/>
  <text x="54" y="377" fill="#f4f4f5" font-size="13" font-weight="600" class="font">AGY-flags</text>

  <!-- Main Content Area -->
  <g class="font" transform="translate(252, 86)">
    <!-- Page Title & Tagline -->
    <text x="0" y="22" fill="#f4f4f5" font-size="22" font-weight="600">AGY-flags</text>
    <text x="0" y="44" fill="#a1a1aa" font-size="13">选择要开启的 Antigravity 实验功能。多数改动要重启 Antigravity 才生效。</text>

    <!-- Restart Notice Banner -->
    <rect x="0" y="60" width="608" height="40" rx="8" fill="#422006" fill-opacity="0.45" stroke="#d97706" stroke-opacity="0.45" stroke-width="1"/>
    <text x="14" y="85" fill="#fde68a" font-size="13">你改了开关，重启 Antigravity 后生效。</text>
    <rect x="488" y="67" width="108" height="26" rx="6" fill="#3b82f6"/>
    <text x="542" y="84" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="500">重启 Antigravity</text>

    <!-- Master Switch Card -->
    <rect x="0" y="114" width="608" height="58" rx="11" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1"/>
    <text x="14" y="138" fill="#f4f4f5" font-size="13.5" font-weight="500">启用 agy-flags</text>
    <text x="14" y="157" fill="#a1a1aa" font-size="12">正在改写 Google 下发给 Antigravity 的开关配置。</text>
    <!-- Switch ON -->
    <rect x="550" y="131" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="143" r="8" fill="#ffffff"/>

    <!-- Section: 中文 -->
    <text x="2" y="196" fill="#e4e4e7" font-size="13.5" font-weight="600">中文</text>
    <rect x="0" y="206" width="608" height="116" rx="11" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1"/>
    <line x1="0" y1="264" x2="608" y2="264" stroke="#2e2e33" stroke-width="1"/>

    <!-- Row 1: 界面汉化 -->
    <text x="14" y="229" fill="#f4f4f5" font-size="13.5" font-weight="500">界面汉化</text>
    <text x="14" y="249" fill="#a1a1aa" font-size="12">把 Antigravity 的按钮、菜单和设置页显示成中文，对话内容不翻译，打开或关掉后要重启。</text>
    <rect x="550" y="223" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="235" r="8" fill="#ffffff"/>

    <!-- Row 2: 中文对话标题 -->
    <text x="14" y="287" fill="#f4f4f5" font-size="13.5" font-weight="500">中文对话标题</text>
    <rect x="104" y="274" width="96" height="17" rx="8.5" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="152" y="286" text-anchor="middle" fill="#d4d4d8" font-size="10" font-weight="600">改动起标题的请求</text>
    <text x="14" y="307" fill="#a1a1aa" font-size="12">新对话的标题用中文起，不用重启。</text>
    <rect x="550" y="281" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="293" r="8" fill="#ffffff"/>

    <!-- Section: 用量和费用 -->
    <text x="2" y="346" fill="#e4e4e7" font-size="13.5" font-weight="600">用量和费用</text>
    <rect x="0" y="356" width="608" height="174" rx="11" fill="#1c1c1f" stroke="#2e2e33" stroke-width="1"/>
    <line x1="0" y1="414" x2="608" y2="414" stroke="#2e2e33" stroke-width="1"/>
    <line x1="0" y1="472" x2="608" y2="472" stroke="#2e2e33" stroke-width="1"/>

    <!-- Row 1: 上下文用量指示器 -->
    <text x="14" y="379" fill="#f4f4f5" font-size="13.5" font-weight="500">上下文用量指示器</text>
    <text x="14" y="399" fill="#a1a1aa" font-size="12">在输入框旁显示上下文已经用了多少；重启后还要在 Chat Layout 里打开指示器开关。</text>
    <rect x="550" y="373" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="385" r="8" fill="#ffffff"/>

    <!-- Row 2: 回复用量 -->
    <text x="14" y="437" fill="#f4f4f5" font-size="13.5" font-weight="500">回复用量</text>
    <text x="14" y="457" fill="#a1a1aa" font-size="12">每条回复下面多一个 $ 按钮，点开能看到这一轮用了多少 token、多少命中了缓存。</text>
    <rect x="550" y="431" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="443" r="8" fill="#ffffff"/>

    <!-- Row 3: 估算费用 -->
    <text x="14" y="495" fill="#f4f4f5" font-size="13.5" font-weight="500">估算费用</text>
    <rect x="76" y="482" width="90" height="17" rx="8.5" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="121" y="494" text-anchor="middle" fill="#d4d4d8" font-size="10" font-weight="600">连接 models.dev</text>
    <text x="14" y="515" fill="#a1a1aa" font-size="12">按 models.dev 上的公开价格，把回复用量里一直显示 $0 的费用算出来，只是估算，不是账单。</text>
    <rect x="550" y="489" width="44" height="24" rx="12" fill="#3b82f6"/>
    <circle cx="582" cy="501" r="8" fill="#ffffff"/>
  </g>
</svg>
